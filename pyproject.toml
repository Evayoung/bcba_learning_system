[project]
name = "bcba-learning-system"
version = "1.0.0"
description = "BCBA AI Learning Assistant — RAG tutor grounded in the PTB ABA Exam Study Manual"
readme = {text = "BCBA AI Learning Assistant - Grounded RAG Study Companion", content-type = "text/plain"}
requires-python = ">=3.13"
dependencies = [
    # Web Framework
    "python-fasthtml>=0.14.13",
    "faststrap",
    "uvicorn>=0.38.0",
    "starlette>=1.6.0",
    "python-multipart>=0.0.20",
    "itsdangerous>=2.2.0",
    # Database
    "SQLAlchemy>=2.0.45",
    "aiosqlite>=0.22.0",
    # AI Providers
    "google-genai>=0.5.0",
    "groq>=0.11.0",
    # Config & Environment
    "python-dotenv>=1.2.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    # HTTP
    "httpx>=0.28.1",
    "anyio>=4.12.0",
    # Utilities
    "fastcore>=2.2.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]

[tool.fastapi]
# FastAPI Cloud entrypoint — points to the ASGI app instance
entrypoint = "app.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
